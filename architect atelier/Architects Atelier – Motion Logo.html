<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Architects Atelier – Motion Logo</title>
<style>
:root{--bg:#fafafa;--ink:#0a0a0a;--accent:#ff8205;--grid:rgba(10,10,10,.09);--btn:#0a0a0a;--btnink:#fafafa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--ink:#f5f3ee;--grid:rgba(245,243,238,.1);--btn:#f5f3ee;--btnink:#0d0d0d}}
:root[data-theme="dark"]{--bg:#0d0d0d;--ink:#f5f3ee;--grid:rgba(245,243,238,.1);--btn:#f5f3ee;--btnink:#0d0d0d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:'Times New Roman',Times,serif;overflow:hidden}
svg{width:min(94vw,1280px);height:auto;display:block;overflow:visible}
.ctl{display:flex;gap:10px}
button{font:600 14px Arial,Helvetica,sans-serif;background:var(--btn);color:var(--btnink);border:0;padding:10px 20px;border-radius:2px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ink{fill:var(--ink)} .acc{fill:var(--accent)}
.a{opacity:0}
.gl{stroke:var(--grid);stroke-width:1.5;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.ol{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:100;stroke-dashoffset:100}
.div{stroke:var(--ink);stroke-width:3;stroke-dasharray:100;stroke-dashoffset:100}
.sq,.rip,.reg{transform-box:fill-box;transform-origin:center}
.rip{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.serif{font-family:'Times New Roman',Times,'Liberation Serif',serif;font-weight:700;font-size:237px}
.sans{font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-weight:700}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
@keyframes gridin{0%{opacity:0;stroke-dashoffset:100}20%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes slide{from{opacity:0;transform:translate(var(--x),var(--y))}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:1;transform:scale(0)}60%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{transform:translateY(150px)}to{transform:none}}
@keyframes ripple{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
@keyframes show{to{opacity:1}}
.play .gl{animation:gridin 1.2s ease-out var(--d) both,fade 1s ease 3.2s forwards}
.play .ol{animation:draw 1.5s cubic-bezier(.65,0,.35,1) .5s both,fade .7s ease 2.5s forwards}
.play .blk{animation:slide 1.1s cubic-bezier(.16,1,.3,1) var(--d) both}
.play .sq{animation:pop .9s cubic-bezier(.34,1.3,.64,1) 2.5s both}
.play .rip{animation:ripple 1.6s ease-out var(--d) both}
.play .reg{animation:pop .7s cubic-bezier(.34,1.3,.64,1) 3.1s both}
.play .div{animation:draw 1s cubic-bezier(.65,0,.35,1) 3s both,show .01s 3s both}
.play .rise{animation:rise 1.1s cubic-bezier(.16,1,.3,1) var(--d) both}
.out{animation:fade .8s ease forwards}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<svg id="logo" viewBox="0 0 2160 725" role="img" aria-label="Architects Atelier logo animation">
  <defs>
    <path id="b1" pathLength="100" d="M170 50H441V135H170Z"/>
    <path id="b2" pathLength="100" d="M451 50H601V200H515V135H451Z"/>
    <path id="b3" pathLength="100" d="M170 220H258V392H441V210H268V198H451V478H170Z"/>
    <path id="b4" pathLength="100" d="M515 210H601V478H515Z"/>
    <clipPath id="c1"><rect x="840" y="90" width="1140" height="230"/></clipPath>
    <clipPath id="c2"><rect x="840" y="330" width="780" height="230"/></clipPath>
    <clipPath id="c3"><rect x="160" y="505" width="490" height="78"/></clipPath>
    <clipPath id="c4"><rect x="240" y="588" width="340" height="70"/></clipPath>
  </defs>

  <g id="grid"></g>

  <g class="outlines">
    <use href="#b1" class="ol"/><use href="#b2" class="ol"/><use href="#b3" class="ol"/><use href="#b4" class="ol"/>
  </g>

  <g class="ink">
    <use href="#b1" class="blk a" style="--x:-320px;--y:0px;--d:1.6s"/>
    <use href="#b2" class="blk a" style="--x:0px;--y:-260px;--d:1.75s"/>
    <use href="#b3" class="blk a" style="--x:0px;--y:300px;--d:1.9s"/>
    <use href="#b4" class="blk a" style="--x:320px;--y:0px;--d:2.05s"/>
  </g>

  <rect class="sq acc a" x="270" y="222" width="160" height="160"/>
  <rect class="rip" x="270" y="222" width="160" height="160" style="--d:3.3s"/>
  <rect class="rip" x="270" y="222" width="160" height="160" style="--d:3.6s"/>

  <g class="reg a">
    <circle cx="652" cy="85" r="32" fill="none" stroke="var(--ink)" stroke-width="7"/>
    <text x="652" y="104" text-anchor="middle" class="sans ink" font-size="52">R</text>
  </g>

  <g clip-path="url(#c3)"><text class="rise sans ink" x="170" y="572" font-size="80" textLength="466" lengthAdjust="spacingAndGlyphs" style="--d:3.7s"><tspan class="acc">A</tspan>RCHITECTS</text></g>
  <g clip-path="url(#c4)"><text class="rise sans ink" x="250" y="648" font-size="78" textLength="310" lengthAdjust="spacingAndGlyphs" style="--d:3.85s"><tspan class="acc">A</tspan>TELIER</text></g>

  <line class="div" pathLength="100" x1="747" y1="45" x2="747" y2="675"/>

  <g clip-path="url(#c1)"><text class="rise serif ink" x="853" y="292" textLength="1092" lengthAdjust="spacingAndGlyphs" style="--d:3.4s"><tspan class="acc">A</tspan>rchitects</text></g>
  <g clip-path="url(#c2)"><text class="rise serif ink" x="853" y="532" textLength="727" lengthAdjust="spacingAndGlyphs" style="--d:3.6s"><tspan class="acc">A</tspan>telier</text></g>
</svg>

<div class="ctl">
  <button id="replay" type="button">Replay</button>
  <button id="theme" type="button">Switch theme</button>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg',svg=document.getElementById('logo'),g=document.getElementById('grid');
  function ln(x1,y1,x2,y2,d){var l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('pathLength','100');l.setAttribute('class','gl');l.style.setProperty('--d',d+'s');g.appendChild(l)}
  for(var i=0;i<=24;i++)ln(i*90,-40,i*90,765,(i*0.035).toFixed(2));
  for(var j=0;j<=8;j++)ln(-40,j*90,2200,j*90,(j*0.05).toFixed(2));
  var timer;
  function play(){
    clearTimeout(timer);
    svg.classList.remove('play','out');
    void svg.getBoundingClientRect();
    svg.classList.add('play');
    timer=setTimeout(function(){svg.classList.add('out');timer=setTimeout(play,900)},8800);
  }
  document.getElementById('replay').addEventListener('click',play);
  document.getElementById('theme').addEventListener('click',function(){
    var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme',dark?'light':'dark');
  });
  play();
})();
</script>
</body>
</html>
